name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-package:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package release app
        run: bash scripts/package_macos_app.sh 1.0.0
